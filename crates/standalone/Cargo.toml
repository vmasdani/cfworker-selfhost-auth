[package]
name = "cfsa-standalone"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Native standalone server (replaces packages/standalone): one single-threaded process per app.
#   rusqlite (bundled SQLite: a static binary, no system library)
#   hyper + tokio current-thread: HTTP/1.1 behind the TLS reverse proxy
#   brotli + flate2: static files are precompressed once at startup
[dependencies]
cfsa-core.workspace = true
serde_json.workspace = true
rusqlite = { version = "0.37", features = ["bundled"] }
tokio = { version = "1", features = ["rt", "net", "macros", "signal", "time"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server-graceful", "http1"] }
http-body-util = "0.1"
bytes = "1"
brotli = "8"
flate2 = "1"
