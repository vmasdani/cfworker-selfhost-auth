[package]
name = "coffer-rs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# cdylib: the Worker (wasm32, built by worker-build). The `coffer-server` binary: standalone mode.
[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "coffer-server"
path = "src/main.rs"

[dependencies]
cfsa-core.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cfsa-standalone.workspace = true
